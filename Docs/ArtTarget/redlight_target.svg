<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Luckiest Guy','Arial Rounded MT Bold',Arial,sans-serif">
<!--
  RED LIGHT, BARNABY - art target.  Reference: Fall Guys.
  Agreed shape: THIRD-PERSON CAMERA BEHIND YOUR OWN CHARACTER, not a broadcast tripod
  over the whole field. Other players stay visible - the crowd stumbling around you is
  the point - but the roster list, the pile of overlapping name tags and the dev
  overlays all go. Bright saturated candy palette, chunky rounded geometry, soft light.
-->
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#2bb8f0"/><stop offset="45%" stop-color="#7fd8f7"/>
    <stop offset="78%"  stop-color="#ffd7ea"/><stop offset="100%" stop-color="#ffeccd"/>
  </linearGradient>
  <linearGradient id="courseG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8f7fe0"/><stop offset="55%" stop-color="#a894ee"/>
    <stop offset="100%" stop-color="#c3b2ff"/>
  </linearGradient>
  <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ff9ecb"/><stop offset="100%" stop-color="#f26fae"/>
  </linearGradient>
  <linearGradient id="heroBody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ff7fb4"/><stop offset="100%" stop-color="#e12e77"/>
  </linearGradient>
  <linearGradient id="domeG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
    <stop offset="100%" stop-color="#bfe0f5" stop-opacity="0.5"/>
  </linearGradient>
  <linearGradient id="lower3" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2a1350" stop-opacity="0.92"/>
    <stop offset="68%" stop-color="#3b1c68" stop-opacity="0.72"/>
    <stop offset="100%" stop-color="#3b1c68" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="filGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fff0b8" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#ffc94d" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="50%" cy="46%" r="74%">
    <stop offset="58%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#2a0f45" stop-opacity="0.45"/>
  </radialGradient>
  <linearGradient id="meterG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff5a7a"/><stop offset="55%" stop-color="#ffd257"/>
    <stop offset="100%" stop-color="#4ef0b0"/>
  </linearGradient>
  <filter id="softShadow"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4a1f6e" flood-opacity="0.42"/></filter>
  <filter id="txtShadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#3a0f52" flood-opacity="0.8"/></filter>
  <filter id="farBlur"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="glowS"><feGaussianBlur stdDeviation="14"/></filter>
</defs>

<rect width="1920" height="1080" fill="url(#sky)"/>

<!-- balloons + bunting: the tone is a TV game show, not an obstacle course -->
<g opacity="0.9">
  <circle cx="215" cy="196" r="40" fill="#ffd257"/><rect x="213" y="234" width="3" height="52" fill="#ffffff" opacity="0.6"/>
  <circle cx="300" cy="152" r="30" fill="#5ce1e6"/><rect x="298" y="180" width="3" height="44" fill="#ffffff" opacity="0.6"/>
  <circle cx="1668" cy="176" r="36" fill="#ff8fc4"/><rect x="1666" y="210" width="3" height="50" fill="#ffffff" opacity="0.6"/>
  <circle cx="1756" cy="128" r="26" fill="#a98bff"/><rect x="1754" y="152" width="3" height="40" fill="#ffffff" opacity="0.6"/>
</g>

<!-- distant stands, soft and low-contrast so the CAST is the brightest thing on screen -->
<g filter="url(#farBlur)" opacity="0.75">
  <rect x="0" y="330" width="700" height="96" rx="16" fill="#8f7fd6"/>
  <rect x="1220" y="330" width="700" height="96" rx="16" fill="#8f7fd6"/>
  <g fill="#b9a9f0">
    <circle cx="70" cy="366" r="14"/><circle cx="140" cy="358" r="14"/><circle cx="212" cy="368" r="14"/>
    <circle cx="284" cy="356" r="14"/><circle cx="356" cy="368" r="14"/><circle cx="428" cy="357" r="14"/>
    <circle cx="500" cy="367" r="14"/><circle cx="572" cy="356" r="14"/><circle cx="644" cy="367" r="14"/>
    <circle cx="1290" cy="366" r="14"/><circle cx="1362" cy="357" r="14"/><circle cx="1434" cy="368" r="14"/>
    <circle cx="1506" cy="356" r="14"/><circle cx="1578" cy="367" r="14"/><circle cx="1650" cy="357" r="14"/>
    <circle cx="1722" cy="366" r="14"/><circle cx="1794" cy="356" r="14"/><circle cx="1866" cy="368" r="14"/>
  </g>
</g>

<!-- ================= COURSE, from BEHIND the player ================= -->
<path d="M 726 424 L 1194 424 L 2020 1080 L -100 1080 Z" fill="url(#courseG)"/>
<!-- candy lane stripes, converging: reads as speed the moment it scrolls -->
<g fill="#ffffff" opacity="0.13">
  <path d="M 806 424 L 838 424 L 700 1080 L 470 1080 Z"/>
  <path d="M 962 424 L 994 424 L 1080 1080 L 850 1080 Z"/>
  <path d="M 1118 424 L 1150 424 L 1460 1080 L 1230 1080 Z"/>
</g>
<!-- side walls -->
<path d="M 726 424 L 742 424 L -20 1080 L -100 1080 Z" fill="url(#wallG)"/>
<path d="M 1178 424 L 1194 424 L 2020 1080 L 1940 1080 Z" fill="url(#wallG)"/>

<!-- FINISH GATE, far up the course -->
<g filter="url(#farBlur)">
  <rect x="838" y="352" width="18" height="76" rx="6" fill="#ffd257"/>
  <rect x="1064" y="352" width="18" height="76" rx="6" fill="#ffd257"/>
  <rect x="826" y="336" width="268" height="26" rx="12" fill="#ffd257"/>
  <text x="960" y="356" font-size="19" fill="#8a5a00" text-anchor="middle">FINISH</text>
</g>

<!-- chunky rounded obstacles -->
<g filter="url(#softShadow)">
  <rect x="800" y="470" width="150" height="26" rx="13" fill="#5ce1e6"/>
  <rect x="1010" y="470" width="120" height="26" rx="13" fill="#5ce1e6"/>
  <rect x="742" y="566" width="230" height="38" rx="19" fill="#ffb54d"/>
  <rect x="1090" y="566" width="180" height="38" rx="19" fill="#ffb54d"/>
  <rect x="640" y="716" width="300" height="54" rx="27" fill="#5ce1e6"/>
</g>

<!-- ============ OTHER PLAYERS: still there, unnamed, part of the chaos ============ -->
<!-- Fall Guys keeps the crowd. What goes is the roster box and the pile of name tags. -->
<g filter="url(#farBlur)">
  <g><rect x="880" y="452" width="30" height="42" rx="15" fill="#5ce1e6"/>
     <ellipse cx="895" cy="450" rx="19" ry="14" fill="#eaf6ff" opacity="0.92"/></g>
  <g><rect x="1002" y="470" width="36" height="50" rx="18" fill="#ffb54d"/>
     <ellipse cx="1020" cy="468" rx="23" ry="16" fill="#eaf6ff" opacity="0.92"/></g>
</g>
<g filter="url(#softShadow)">
  <!-- mid-distance rival, mid-stumble -->
  <g transform="rotate(-13 780 640)">
    <rect x="742" y="592" width="58" height="82" rx="29" fill="#a98bff"/>
    <ellipse cx="771" cy="590" rx="36" ry="26" fill="#eaf6ff" opacity="0.92"/>
  </g>
  <!-- a rival just ahead and to the right -->
  <g><rect x="1188" y="636" width="72" height="104" rx="36" fill="#ffd257"/>
     <ellipse cx="1224" cy="634" rx="45" ry="32" fill="#eaf6ff" opacity="0.92"/></g>
  <!-- one eliminated, greyed - readable at a glance without a name tag -->
  <g opacity="0.5"><rect x="596" y="612" width="60" height="86" rx="30" fill="#8d93a8"/>
     <ellipse cx="626" cy="610" rx="38" ry="27" fill="#c6ccd8" opacity="0.85"/></g>
</g>

<!-- ================= YOU: third person, from BEHIND, ~26% of frame ================= -->
<g filter="url(#softShadow)">
  <ellipse cx="960" cy="978" rx="118" ry="24" fill="#4a1f6e" opacity="0.32"/>
  <rect x="905" y="905" width="42" height="70" rx="21" fill="#a3134f"/>
  <rect x="973" y="905" width="42" height="70" rx="21" fill="#a3134f"/>
  <rect x="866" y="676" width="188" height="268" rx="94" fill="url(#heroBody)"/>
  <rect x="828" y="716" width="46" height="150" rx="23" fill="#f2568f"/>
  <rect x="1046" y="716" width="46" height="150" rx="23" fill="#f2568f"/>
  <!-- dome from behind: no face. The glowing wire is the read. -->
  <circle cx="960" cy="676" r="112" fill="url(#filGlow)" opacity="0.8"/>
  <path d="M 856 686 A 104 104 0 0 1 1064 686 Z" fill="url(#domeG)"/>
  <ellipse cx="960" cy="686" rx="104" ry="17" fill="#e8f4ff" opacity="0.7"/>
  <g filter="url(#glowS)" opacity="0.95">
    <path d="M 916 652 q 22 -40 44 0 q 22 40 44 -12" stroke="#ffd257" stroke-width="15" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M 916 652 q 22 -40 44 0 q 22 40 44 -12" stroke="#fff6d2" stroke-width="6" fill="none" stroke-linecap="round"/>
</g>

<rect width="1920" height="1080" fill="url(#vig)"/>

<!-- ================= HUD: minimal, Fall Guys shaped ================= -->
<text x="960" y="176" font-size="150" fill="#ff3b5c" text-anchor="middle" filter="url(#txtShadow)" letter-spacing="8">STOP</text>
<text x="960" y="234" font-size="38" fill="#ffffff" text-anchor="middle" filter="url(#txtShadow)">Freeze. I am watching you specifically.</text>

<!-- how many are left: a COUNT, not a list of names -->
<g filter="url(#txtShadow)">
  <rect x="1610" y="52" width="258" height="104" rx="26" fill="#2a1350" opacity="0.62"/>
  <text x="1739" y="98" font-size="26" fill="#c3b2ff" text-anchor="middle" letter-spacing="3">STILL IN</text>
  <text x="1739" y="140" font-size="42" fill="#ffffff" text-anchor="middle">4 / 5</text>
</g>

<!-- YOUR standing only. The Filament glow above, the number here. -->
<g filter="url(#txtShadow)">
  <rect x="52" y="52" width="330" height="104" rx="26" fill="#2a1350" opacity="0.62"/>
  <text x="80" y="94" font-size="24" fill="#c3b2ff" letter-spacing="2">BARNABY LIKES YOU</text>
  <rect x="80" y="110" width="274" height="16" rx="8" fill="#1b0d36"/>
  <rect x="80" y="110" width="196" height="16" rx="8" fill="url(#meterG)"/>
</g>

<!-- Barnaby: he is the differentiator, so he gets a broadcast lower-third -->
<g>
  <rect x="0" y="964" width="1420" height="116" fill="url(#lower3)"/>
  <circle cx="82" cy="1020" r="36" fill="#ffd257"/>
  <text x="82" y="1034" font-size="36" fill="#4a2a00" text-anchor="middle">B</text>
  <text x="144" y="1008" font-size="22" fill="#ffd257" letter-spacing="3">BARNABY QUILL</text>
  <text x="144" y="1050" font-size="31" fill="#ffffff">“I saw that. I did not, but I said it, and that is what counts.”</text>
</g>
</svg>
