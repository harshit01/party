    <g fill="#ff7f9c"><circle cx="1560" cy="536" r="9"/><circle cx="1700" cy="574" r="9"/><circle cx="1850" cy="616" r="9"/></g>
    <g fill="#6cc7f5"><circle cx="1620" cy="560" r="9"/><circle cx="1770" cy="600" r="9"/><circle cx="1900" cy="640" r="9"/></g>
