  <ellipse cx="1116" cy="900" rx="34" ry="16" fill="#e2e8f2"/><rect x="1082" y="850" width="68" height="52" fill="#e2e8f2"/>

  <!-- other contestants ON the lane, clearly visible -->
  <g transform="translate(700,742) scale(0.46)">
    <ellipse cx="0" cy="0" rx="54" ry="62" fill="#4aa8e8"/><circle cx="0" cy="-60" r="48" fill="#f2f6fc"/>
    <circle cx="-16" cy="-62" r="9" fill="#141b2c"/><circle cx="16" cy="-62" r="9" fill="#141b2c"/><polygon points="0,-50 -10,-32 10,-32" fill="#f5a63a"/>
  </g>
  <g transform="translate(1230,748) scale(0.44)">
    <ellipse cx="0" cy="0" rx="54" ry="62" fill="#5fdca6"/><circle cx="0" cy="-60" r="48" fill="#f2f6fc"/>
    <circle cx="-16" cy="-62" r="9" fill="#141b2c"/><circle cx="16" cy="-62" r="9" fill="#141b2c"/><polygon points="0,-50 -10,-32 10,-32" fill="#f5a63a"/>
  </g>
  <g transform="translate(960,726) scale(0.40)">
    <ellipse cx="0" cy="0" rx="54" ry="62" fill="#f2c455"/><circle cx="0" cy="-60" r="48" fill="#f2f6fc"/>
    <circle cx="-16" cy="-62" r="9" fill="#141b2c"/><circle cx="16" cy="-62" r="9" fill="#141b2c"/><polygon points="0,-50 -10,-32 10,-32" fill="#f5a63a"/>
  </g>

  <!-- lighting truss with spot cones -->
  <rect x="440" y="300" width="1060" height="22" rx="8" fill="#2c3550"/>
  <g fill="#22293f"><rect x="560" y="322" width="34" height="30" rx="6"/><rect x="880" y="322" width="34" height="30" rx="6"/><rect x="1220" y="322" width="34" height="30" rx="6"/></g>
</g>

