  <path d="M 620 690 L 1330 690 L 1560 1080 L 380 1080 Z" fill="url(#lane)"/>
  <path d="M 700 720 L 1252 720 L 1268 748 L 684 748 Z" fill="#e9eef7" opacity="0.75"/>

  <!-- FINISH GANTRY with a banner -->
  <rect x="612" y="556" width="26" height="140" rx="6" fill="#f0c95c"/>
  <rect x="1316" y="556" width="26" height="140" rx="6" fill="#f0c95c"/>
  <rect x="600" y="530" width="756" height="40" rx="10" fill="#ffd76b"/>
  <rect x="640" y="576" width="676" height="34" rx="8" fill="#26365e" opacity="0.85"/>

  <!-- hazards on the lane: sweeper bar, piston blocks, slalom pillars -->
