  <circle cx="977" cy="802" r="18" fill="#cfd8e8"/>
  <rect x="560" y="880" width="150" height="60" rx="12" fill="#e8555f"/>
  <rect x="1244" y="880" width="150" height="60" rx="12" fill="#e8555f"/>
