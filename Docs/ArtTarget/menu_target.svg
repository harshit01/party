<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0e4fb8"/><stop offset="38%" stop-color="#3d90e0"/>
    <stop offset="70%" stop-color="#8fc9ee"/><stop offset="100%" stop-color="#ffe0b0"/>
  </linearGradient>
  <linearGradient id="arenaFloor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7b8fb5"/><stop offset="100%" stop-color="#4d5d80"/>
  </linearGradient>
  <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#9fb4d6"/><stop offset="100%" stop-color="#6d80a6"/>
  </linearGradient>
  <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3f4f74"/><stop offset="100%" stop-color="#2a3555"/>
  </linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ff87ad"/><stop offset="100%" stop-color="#dd2f68"/>
  </linearGradient>
  <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#dbe2f0"/>
  </linearGradient>
  <linearGradient id="panelG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#122f5c" stop-opacity="0.74"/>
    <stop offset="100%" stop-color="#081a3a" stop-opacity="0.82"/>
  </linearGradient>
  <linearGradient id="bPlay" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff4d7d"/><stop offset="100%" stop-color="#d4114f"/></linearGradient>
  <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#45b6f7"/><stop offset="100%" stop-color="#0f74d4"/></linearGradient>
  <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9070f2"/><stop offset="100%" stop-color="#5732cc"/></linearGradient>
  <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#33dbab"/><stop offset="100%" stop-color="#08a077"/></linearGradient>
  <linearGradient id="b4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffab42"/><stop offset="100%" stop-color="#e07207"/></linearGradient>
  <linearGradient id="b5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#616880"/><stop offset="100%" stop-color="#343a4c"/></linearGradient>
  <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fff4d4" stop-opacity="0.75"/><stop offset="100%" stop-color="#fff4d4" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="spotG" cx="50%" cy="0%" r="72%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="drop"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06213f" flood-opacity="0.5"/></filter>
</defs>

<rect width="1920" height="1080" fill="url(#sky)"/>

<!-- ================= ARENA: a real place, clearly readable ================= -->
<g filter="url(#blur6)">
  <!-- audience stands, left and right, tiered -->
  <g>
    <path d="M -20 640 L 470 512 L 470 700 L -20 760 Z" fill="url(#stand)"/>
    <path d="M 1500 512 L 1940 640 L 1940 760 L 1500 700 Z" fill="url(#stand)"/>
  </g>
  <!-- crowd dots -->
  <g>
    <g fill="#ff7f9c"><circle cx="60" cy="646" r="9"/><circle cx="150" cy="622" r="9"/><circle cx="300" cy="586" r="9"/><circle cx="410" cy="560" r="9"/></g>
    <g fill="#6cc7f5"><circle cx="105" cy="662" r="9"/><circle cx="215" cy="632" r="9"/><circle cx="355" cy="596" r="9"/></g>
    <g fill="#7fe3b4"><circle cx="60" cy="686" r="9"/><circle cx="255" cy="612" r="9"/><circle cx="430" cy="576" r="9"/></g>
